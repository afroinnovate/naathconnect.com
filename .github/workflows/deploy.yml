name: Deploy to GitHub Pages

# FROZEN until Tango Tew explicitly approves production hosting.
# The previous job force-pushed the gh-pages branch, which is the live
# GitHub Pages site (CNAME naathconnect.com). This revamp is a Next.js
# app and must not be copied onto GitHub Pages. Running this workflow
# does not change gh-pages, DNS, or the registrar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse production deploy
        run: |
          echo "Production deploy is frozen."
          echo "Nothing was published. The gh-pages branch was not changed."
          echo "GitHub Pages cannot run this Next.js app. See docs/DIAGNOSIS.md."
          exit 1
