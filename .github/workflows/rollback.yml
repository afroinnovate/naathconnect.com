name: Rollback Deployment

# Neutralized. This used to force-push a tag onto gh-pages, which published
# the old static site. It has no pages permission and cannot publish.
# Production is Amplify on main. See docs/CI-CD.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse:
    name: refuse gh-pages rollback
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish GitHub Pages
        run: |
          echo "Rollback to GitHub Pages is disabled."
          echo "gh-pages was not changed."
          echo "Production deploys when a pull request merges to main and Amplify builds that branch."
          exit 1
